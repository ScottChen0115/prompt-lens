[project]
name = "misunderstanding-risk"
version = "0.1.0"
description = "Local preparation for a calibrated misunderstanding-risk classifier"
requires-python = ">=3.13,<3.14"
dependencies = [
  "torch>=2.5,<3",
  "transformers>=5.17,<6",
  "datasets>=3,<6",
  "accelerate>=1,<2",
  "scikit-learn>=1.6,<2",
  "numpy>=2,<3",
  "pandas>=2,<4",
  "matplotlib>=3.9,<4",
  "safetensors>=0.5,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.uv]
package = false
